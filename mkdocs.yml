site_name: Vitrify
site_description: Turn a SPARQL retrieval into a durable local file.
repo_url: https://github.com/iolanta-tech/vitrify
watch:
  - templates
hooks:
  - docs_macros/site.py
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/file-tabs.js
  - javascripts/example-history.js

theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: default
    primary: teal
    accent: cyan
  features:
    - navigation.tabs
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true

plugins:
  - search
  - macros:
      module_name: docs_macros
      modules: [mkdocs_macros_sparqld]
      on_error_fail: true

exclude_docs: |
  **/AGENTS.md
  contexts/**

nav:
  - Home: index.md
  - Examples:
      - examples/index.md
      - Query from a file: examples/query-from-file.md
      - Add an example: examples/authoring.md
  - cli.md
  - Outputs:
      - outputs/index.md
      - RO-Crate: outputs/ro-crate/index.md
  - roadmap.md
