site_name: Vitrify
site_description: Turn a SPARQL retrieval into a durable local file.
repo_url: https://github.com/iolanta-tech/vitrify
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/file-tabs.js

theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: default
    primary: teal
    accent: cyan
  features:
    - navigation.tabs
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true

plugins:
  - search
  - macros:
      module_name: docs_macros
      on_error_fail: true

exclude_docs: |
  **/AGENTS.md

nav:
  - Home: index.md
  - Examples:
      - examples/index.md
      - EU capitals: examples/eu-capitals.md
      - Query from a file: examples/query-from-file.md
      - Female Nobel laureates: examples/female-persons.md
      - Top ten metaclasses: examples/top-metaclasses.md
      - Metaclasses of metaclasses: examples/metaclasses-of-metaclasses.md
      - Fourth-order classes: examples/fourth-order-classes.md
      - Time-bounded subclasses: examples/time-bounded-subclasses.md
      - SELECT response returned as JSON: examples/select-turtle.md
  - cli.md
  - Outputs:
      - outputs/index.md
      - RO-Crate: outputs/ro-crate/index.md
  - roadmap.md
