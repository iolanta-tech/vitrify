site_name: Vitrify
site_description: Turn a SPARQL retrieval into a durable local file.
repo_url: https://github.com/iolanta-tech/vitrify
extra_css:
  - stylesheets/extra.css

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true

plugins:
  - search
  - macros:
      module_name: docs_macros
      on_error_fail: true
  - table-reader

exclude_docs: |
  **/AGENTS.md

nav:
  - Home: index.md
  - Examples:
      - examples/index.md
      - Query from stdin: examples/stdin.md
      - Female Nobel laureates: examples/female-persons.md
      - Time-bounded subclasses: examples/time-bounded-subclasses.md
      - SELECT response returned as JSON: examples/select-turtle.md
  - Command reference: command.md
  - Output and provenance: output.md
  - Local workflows: workflows.md
  - Roadmap: roadmap.md
