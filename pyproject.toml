[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vitrify-site"
version = "0.1.1"
description = "Documentation site and development commands for Vitrify."
readme = "docs/index.md"
requires-python = ">=3.12"
dependencies = [
    "jeeves-shell[all]",
    "mkdocs>=1.6",
    "mkdocs-material>=9.7.0",
    "mkdocs-macros-plugin>=1.5.0",
    "pymdown-extensions>=10.0",
    "roc-validator",
    "ruff>=0.17.1,<0.18",
    "sh>=2.0",
    "wemake-python-styleguide>=1.8.1,<2",
]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py312"
include = ["*.py", "*.pyi"]
extend-exclude = [".docs-tools", "build", "site", "target", "docs/examples"]
